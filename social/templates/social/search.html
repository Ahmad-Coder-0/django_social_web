{% extends "social/base.html" %}
{% block title %}جستجو{% endblock %}

{% block content %}
  <h1 class="mb-4 text-lg font-bold text-zinc-800 dark:text-zinc-100">جستجو</h1>

  <form method="get" action="{% url 'social:search' %}" class="mb-5">
    <div class="relative">
      <input type="search" name="q" value="{{ query }}" placeholder="جستجوی پست‌ها، نظرات و کاربران…"
             class="form-input pr-10 dark:bg-zinc-800 dark:border-zinc-700 dark:text-zinc-200" autocomplete="off" autofocus>
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
        <svg class="h-5 w-5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
    </div>
  </form>

  <div id="search-results">
    {% include "social/_search_results.html" %}
  </div>
{% endblock %}
