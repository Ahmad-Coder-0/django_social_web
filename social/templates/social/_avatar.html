{% if u.profile_avatar %}
  <img src="{{ u.profile_avatar.url }}" alt="{{ u.username }}" class="{{ size }} shrink-0 rounded-full object-cover ring-1 ring-zinc-200">
{% else %}
  <div class="{{ size }} flex shrink-0 items-center justify-center rounded-full bg-indigo-100 font-bold text-indigo-700 ring-1 ring-indigo-200">
    {{ u.username|first|upper }}
  </div>
{% endif %}
